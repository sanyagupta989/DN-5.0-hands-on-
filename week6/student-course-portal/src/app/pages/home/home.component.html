<section class="home">
  <h1>{{ portalName }}</h1>
  <p>Welcome to your college course portal. Browse courses, track enrollments and view your GPA.</p>

  <div class="stats">
    <div class="stat"><span>Courses Available</span><strong>{{ coursesAvailable }}</strong></div>
    <div class="stat"><span>Enrolled</span><strong>{{ enrolled }}</strong></div>
    <div class="stat"><span>GPA</span><strong>{{ gpa }}</strong></div>
  </div>

  <div class="actions">
    <button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
    <p *ngIf="message">{{ message }}</p>
  </div>

  <div class="search">
    <label>
      Search courses:
      <input type="text" [(ngModel)]="searchTerm" placeholder="Type to search..." />
    </label>
    <p>Searching for: {{ searchTerm }}</p>
  </div>
</section>
